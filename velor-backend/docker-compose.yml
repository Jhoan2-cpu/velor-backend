services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velor_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "${APP_PORT:-8001}:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - velor_network

  postgres:
    image: postgres:16-alpine
    container_name: velor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-velor}
      POSTGRES_USER: ${DB_USERNAME:-velor}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXPOSE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-velor} -d ${DB_DATABASE:-velor}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - velor_network

networks:
  velor_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
